name: Publish Signed npm Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # GitHub Actions environment name for protections/secrets, not npmjs.com config

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.9
          actions-cache-folder: "emsdk-cache"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Emscripten
        run: emcc --version

      - name: Build with CMake
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -DCHARLS_PEDANTIC_WARNINGS=On -DCHARLS_TREAT_WARNING_AS_ERROR=On
          emmake make -C build

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Publish npm package
        run: npm publish ./dist --access public
